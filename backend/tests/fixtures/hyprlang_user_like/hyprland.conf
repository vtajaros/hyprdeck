# =============================================================================
# Hyprland Configuration Fixture (User-like .conf shape)
# =============================================================================

source = ~/.config/hypr/theme-colors.conf

$mainMod = SUPER
$terminal = kitty
$terminalAlt = alacritty
$menu = wofi --show drun

monitor = eDP-1, 1536x960@60, 0x0, 1
exec-once = systemctl --user start quickshell.service

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $col_active_border
    col.inactive_border = $col_inactive_border
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 6
    }
}

# Core keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, Return, exec, $terminalAlt
bind = $mainMod, Space, exec, $menu
bind = $mainMod, C, killactive,
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, J, togglesplit,

# Screenshot with $(slurp) and empty modifiers ", Print"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Pipes and logical OR "||" in exec
bind = $mainMod, N, exec, dunstctl history-pop || dunstctl close

# ALT + Tab pair
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Hardware keys with bindel and bindl
bindel = , XF86AudioRaiseVolume, exec, quickshell ipc call osd volumeUp 5
bindel = , XF86AudioLowerVolume, exec, quickshell ipc call osd volumeDown 5
bindl  = , XF86AudioMute, exec, quickshell ipc call osd toggleMute

# Mouse drag and resize with bindm
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
